databases:
  - name: api-impact-db
    databaseName: api_impact_db
    user: api_impact_user
    plan: free

services:
  # ── Backend Web Service ──────────────────────────────────────
  - type: web
    name: api-impact-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=backend && node backend/dist/db/migrate.js && node backend/dist/db/seed.js
    startCommand: npm run start --workspace=backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: api-impact-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: api-impact-frontend
          property: host

  # ── Frontend Static Site ─────────────────────────────────────
  - type: web
    name: api-impact-frontend
    runtime: static
    buildCommand: npm install && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: api-impact-backend
          property: host

