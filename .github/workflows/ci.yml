name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint --workspace=backend

  # ── Unit Tests (Classification Rules) ─────────────────────────
  test-classification:
    name: Classification Rule Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run classification-rules unit tests
        working-directory: backend
        run: npx jest src/classification-rules/index.test.ts --coverage --passWithNoTests
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classification-coverage
          path: backend/coverage/

  # ── Diff Engine Regression Tests ─────────────────────────────
  test-diff-engine:
    name: Diff Engine Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run diff-engine regression tests (fixture-based)
        working-directory: backend
        run: npx jest src/diff-engine/openapi-differ.test.ts --passWithNoTests
        env:
          NODE_ENV: test

  # ── Build & Typecheck ─────────────────────────────────────────
  build-check:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend and frontend
        run: npm run build

  # ── Deploy (Render) ───────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [lint, test-classification, test-diff-engine, build-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy (backend)
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        if: env.HOOK_BACKEND != ''
        run: |
          curl -s -X POST "$HOOK_BACKEND"
          echo "Backend deploy triggered"

      - name: Trigger Render deploy (frontend)
        env:
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        if: env.HOOK_FRONTEND != ''
        run: |
          curl -s -X POST "$HOOK_FRONTEND"
          echo "Frontend deploy triggered"
